name: Docker edge

# Every push to master publishes ghcr.io/<owner>/reelix:edge (plus :edge-<sha>) for linux/amd64
# and linux/arm64. Nothing is built under emulation: the amd64 binary is native and the arm64 one
# is cross-compiled with cargo-zigbuild, exactly like release.yml, and docker/Dockerfile.release
# only assembles the runtime image from the two binaries plus the Trunk-built web UI.
# Versioned tags (v*.*.* → :<version>, :<major>.<minor>, :latest) stay with release.yml.
#
# The image is pushed even if CI is red. To gate on CI instead, trigger this workflow with
# `on: workflow_run: {workflows: [CI], types: [completed], branches: [master]}` and run the
# `image` job only when `github.event.workflow_run.conclusion == 'success'`.

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-edge
  # A cancelled run never pushes a half-finished manifest: the image is only pushed at the end.
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  ZIG_VERSION: 0.14.1
  # The build-push-action build record is uploaded as an artifact on every build; nothing here
  # needs it and it only pollutes the run.
  DOCKER_BUILD_RECORD_UPLOAD: false

jobs:
  web:
    name: web UI
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: web
      - uses: taiki-e/install-action@b80e2bb2635f28eb98b9fce1e2f0887e1535c6b2 # v2
        with:
          tool: trunk
      - name: trunk build
        working-directory: crates/reelix-web
        run: trunk build --release
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: web
          path: crates/reelix-web/dist

  linux:
    name: linux ${{ matrix.arch }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      matrix:
        include:
          - arch: x86_64
            docker: amd64
          - arch: aarch64
            docker: arm64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: ${{ matrix.arch }}-unknown-linux-gnu
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: linux-${{ matrix.arch }}
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        # A stuck Zig mirror once hung this step for hours; fail fast so a re-run can retry.
        timeout-minutes: 10
        with:
          version: ${{ env.ZIG_VERSION }}
      - uses: taiki-e/install-action@b80e2bb2635f28eb98b9fce1e2f0887e1535c6b2 # v2
        with:
          tool: cargo-zigbuild
      # Linking against glibc 2.17 makes the binary run on almost any non-musl distribution.
      - name: build
        run: cargo zigbuild --release --locked -p reelix-server --target ${{ matrix.arch }}-unknown-linux-gnu.2.17
      - name: check glibc requirement
        run: |
          bin=target/${{ matrix.arch }}-unknown-linux-gnu/release/reelix
          max=$(objdump -T "$bin" | grep -o 'GLIBC_[0-9.]*' | sort -uV | tail -1)
          echo "Highest glibc symbol: $max"
          [ "$max" = GLIBC_2.17 ] || { echo "::error::Binary needs $max, expected GLIBC_2.17"; exit 1; }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bin-linux-${{ matrix.docker }}
          path: target/${{ matrix.arch }}-unknown-linux-gnu/release/reelix
          if-no-files-found: error

  image:
    name: publish edge image
    needs: [web, linux]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: image name and version
        id: version
        run: |
          base=$(sed -n '/^\[workspace.package\]/,/^\[/s/^version = "\(.*\)"/\1/p' Cargo.toml)
          {
            # GHCR rejects uppercase, so the owner is lowercased as in release.yml.
            echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/reelix"
            echo "version=${base}-edge.$(git rev-parse --short HEAD)"
          } >> "$GITHUB_OUTPUT"
      - id: dl1
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        continue-on-error: true
        with:
          name: web
          path: artifacts/web
      - name: retry download (web)
        if: steps.dl1.outcome == 'failure'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: web
          path: artifacts/web
      - id: dl2
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        continue-on-error: true
        with:
          pattern: bin-linux-*
          path: artifacts
      - name: retry download (bin-linux-*)
        if: steps.dl2.outcome == 'failure'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: bin-linux-*
          path: artifacts
      - name: assemble build context
        run: |
          mkdir -p context/bin/amd64 context/bin/arm64 context/docker
          cp artifacts/bin-linux-amd64/reelix context/bin/amd64/
          cp artifacts/bin-linux-arm64/reelix context/bin/arm64/
          cp -R artifacts/web context/web
          cp docker/entrypoint.sh context/docker/
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ steps.version.outputs.image }}
          flavor: latest=false
          tags: |
            type=raw,value=edge
            type=sha,format=short,prefix=edge-
      # Build and run amd64 first: a broken image fails here, before anything is pushed.
      - name: build (amd64, for the smoke test)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: context
          file: docker/Dockerfile.release
          platforms: linux/amd64
          build-args: VERSION=${{ steps.version.outputs.version }}
          load: true
          tags: reelix:smoke
          cache-from: type=gha
      - name: run smoke test
        run: |
          docker run -d --name reelix -p 7700:7700 reelix:smoke
          for i in $(seq 1 30); do
            docker exec reelix /app/reelix healthcheck && break
            sleep 2
          done
          docker exec reelix /app/reelix healthcheck
          curl -fsS http://127.0.0.1:7700/api/v1/setup
          docker logs reelix
          docker rm -f reelix
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: context
          file: docker/Dockerfile.release
          platforms: linux/amd64,linux/arm64
          build-args: VERSION=${{ steps.version.outputs.version }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          sbom: true
          provenance: mode=max
